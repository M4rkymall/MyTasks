<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, sans-serif" font-size="13">
<rect width="900" height="520" fill="#ffffff"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">Task Management System - Architecture</text>
<!-- browser -->
<rect x="30" y="200" width="110" height="50" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
<text x="85" y="230" text-anchor="middle">Browser</text>
<line x1="140" y1="225" x2="230" y2="225" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="185" y="215" text-anchor="middle" font-size="11">:8080</text>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#333"/></marker></defs>
<!-- network -->
<rect x="215" y="55" width="655" height="290" rx="12" fill="#f8fafc" stroke="#64748b" stroke-dasharray="6 4"/>
<text x="230" y="75" fill="#475569" font-weight="bold">Docker network: task-net (user-defined bridge)</text>
<!-- proxy -->
<rect x="235" y="190" width="130" height="70" rx="8" fill="#fef3c7" stroke="#d97706"/>
<text x="300" y="215" text-anchor="middle" font-weight="bold">proxy</text>
<text x="300" y="233" text-anchor="middle" font-size="11">Nginx 1.27-alpine</text>
<text x="300" y="249" text-anchor="middle" font-size="11">80 -> host 8080</text>
<!-- frontend -->
<rect x="470" y="100" width="150" height="70" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="545" y="125" text-anchor="middle" font-weight="bold">frontend</text>
<text x="545" y="143" text-anchor="middle" font-size="11">React (Vite build)</text>
<text x="545" y="159" text-anchor="middle" font-size="11">served by Nginx :80</text>
<!-- backend -->
<rect x="470" y="240" width="150" height="75" rx="8" fill="#dbeafe" stroke="#2563eb"/>
<text x="545" y="265" text-anchor="middle" font-weight="bold">backend</text>
<text x="545" y="283" text-anchor="middle" font-size="11">Node 22 + Express :3000</text>
<text x="545" y="299" text-anchor="middle" font-size="11">/health, /api/tasks</text>
<!-- volume -->
<g><path d="M700 255 v50 a50 12 0 0 0 100 0 v-50" fill="#fce7f3" stroke="#db2777"/><ellipse cx="750" cy="255" rx="50" ry="12" fill="#fbcfe8" stroke="#db2777"/></g>
<text x="750" y="285" text-anchor="middle" font-size="11">volume: db-data</text>
<text x="750" y="300" text-anchor="middle" font-size="10">/data/tasks.db</text>
<!-- arrows -->
<line x1="365" y1="210" x2="470" y2="140" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="395" y="165" font-size="11">/</text>
<line x1="365" y1="240" x2="470" y2="275" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<text x="395" y="270" font-size="11">/api/, /health</text>
<line x1="620" y1="280" x2="700" y2="280" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<!-- CI/CD -->
<rect x="30" y="390" width="840" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="6 4"/>
<text x="45" y="410" fill="#475569" font-weight="bold">CI/CD (separate compose: infra/jenkins)</text>
<rect x="45" y="425" width="110" height="50" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="100" y="455" text-anchor="middle">git push</text>
<rect x="215" y="425" width="130" height="50" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="280" y="446" text-anchor="middle">GitHub</text><text x="280" y="462" text-anchor="middle" font-size="10">webhook / poll</text>
<rect x="405" y="425" width="170" height="50" rx="8" fill="#fee2e2" stroke="#dc2626"/><text x="490" y="446" text-anchor="middle">Jenkins :8081</text><text x="490" y="462" text-anchor="middle" font-size="10">volume: jenkins_home</text>
<rect x="635" y="425" width="220" height="50" rx="8" fill="#e0e7ff" stroke="#4f46e5"/><text x="745" y="446" text-anchor="middle" font-size="11">Checkout > Test > Build (tag=build #)</text><text x="745" y="462" text-anchor="middle" font-size="11">> Deploy > Smoke Test</text>
<line x1="155" y1="450" x2="215" y2="450" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="345" y1="450" x2="405" y2="450" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<line x1="575" y1="450" x2="635" y2="450" stroke="#333" stroke-width="2" marker-end="url(#a)"/>
<path d="M490 425 C490 380 300 380 300 262" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="400" y="372" fill="#dc2626" font-size="11">docker compose up -d (via docker.sock)</text>
</svg>
