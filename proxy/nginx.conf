server {
    listen 80;

    location = /proxy-health.html {
        default_type text/plain;
        access_log off;
        return 200 "MyTasks proxy OK\n";
    }

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /health {
        proxy_pass http://backend:3000;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
