# Single public entry point: routes browser traffic to the right container.
# Names (frontend, backend) are resolved by Docker's DNS on task-net.
server {
    listen 80;

    # API: no trailing slash on proxy_pass, so /api/tasks reaches the backend as /api/tasks
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health endpoint of the backend (used by smoke tests)
    location = /health {
        proxy_pass http://backend:3000;
    }

    # Everything else is the React app
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
    }
}
