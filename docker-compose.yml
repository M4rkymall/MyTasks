
services:
  proxy:
    build: ./proxy
    image: taskmgr/proxy:${TAG:-latest}
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - task-net

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        BUILD_NUMBER: ${TAG:-dev}
    image: taskmgr/frontend:${TAG:-latest}
    restart: unless-stopped
    networks:
      - task-net

  backend:
    build:
      context: ./backend
      target: production
    image: taskmgr/backend:${TAG:-latest}
    environment:
      PORT: 3000
      DB_FILE: /data/tasks.db
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/tasks
    volumes:
      - db-data:/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - task-net

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - task-net

  migrate:
    image: taskmgr/backend:migrate
    environment:
      DB_FILE: /data/tasks.db
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/tasks
    volumes:
      - db-data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - task-net
    profiles:
      - migration

volumes:
  db-data:
  pg-data:

networks:
  task-net:
