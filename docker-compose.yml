services:
  proxy:
    build: ./proxy
    image: taskmgr/proxy:${TAG:-latest}
    ports:
      - "${HTTP_PORT:-8080}:80"      # the ONLY published port
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks: [task-net]

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        BUILD_NUMBER: ${TAG:-dev}
    image: taskmgr/frontend:${TAG:-latest}
    restart: unless-stopped
    networks: [task-net]

  backend:
    build:
      context: ./backend
      target: production
    image: taskmgr/backend:${TAG:-latest}
    environment:
      PORT: 3000
      DB_FILE: /data/tasks.db
    volumes:
      - db-data:/data                # named volume: data survives down/up and redeploys
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks: [task-net]

  # ---- TODO (with Backend engineer): move to a real DB container ----
